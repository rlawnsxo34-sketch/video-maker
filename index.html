<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>숲체원 프리미엄 영상 제작소</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
        @import url('https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Noto+Serif+KR:wght@300;400;600&display=swap');
        @import url('https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&display=swap');

        body { font-family: 'Pretendard', sans-serif; background-color: #e7e5e4; margin: 0; padding: 0; }
        .font-serif-kr { font-family: 'Noto Serif KR', serif; }
        .font-gowun { font-family: 'Gowun Dodum', sans-serif; }

        @keyframes fadeUp { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
        .animate-fade-up { animation: fadeUp 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        
        @keyframes slideInRight { from { opacity: 0; transform: translateX(30px); } to { opacity: 1; transform: translateX(0); } }
        .toast-enter { animation: slideInRight 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        
        ::-webkit-scrollbar { height: 6px; width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #d6d3d1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #a8a29e; }
        
        .video-container { box-shadow: 0 30px 60px -12px rgba(0, 0, 0, 0.3); transition: all 0.3s ease; }

        .storyboard-item.dragging { opacity: 0.5; border: 2px dashed #a8a29e; }
        .storyboard-item { transition: transform 0.2s, box-shadow 0.2s; }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-0 md:p-6 relative">

    <div id="toast-container" class="fixed top-6 right-6 z-[200] flex flex-col gap-3 pointer-events-none"></div>

    <div id="confirm-modal" class="fixed inset-0 bg-stone-900/60 backdrop-blur-sm z-[150] hidden items-center justify-center">
        <div class="bg-white rounded-2xl w-full max-w-sm p-6 shadow-2xl animate-fade-up">
            <h3 class="text-lg font-serif-kr font-bold text-stone-800 mb-2" id="confirm-title">확인</h3>
            <p class="text-stone-600 font-gowun mb-6 text-sm" id="confirm-message">진행하시겠습니까?</p>
            <div class="flex gap-2 justify-end">
                <button id="confirm-cancel-btn" class="px-4 py-2 rounded-xl border border-stone-200 text-stone-600 font-gowun hover:bg-stone-50 transition">취소</button>
                <button id="confirm-ok-btn" class="px-4 py-2 rounded-xl bg-stone-800 text-white font-gowun hover:bg-stone-900 transition shadow-md">확인</button>
            </div>
        </div>
    </div>

    <div class="w-full max-w-[1600px] bg-white md:rounded-[2rem] shadow-2xl overflow-hidden flex flex-col min-h-screen md:min-h-[90vh] md:max-h-[95vh] border border-stone-200 animate-fade-up relative">
        
        <!-- 헤더 -->
        <header class="px-6 py-4 flex justify-between items-center border-b border-stone-100 bg-white z-20">
            <div class="flex items-center gap-3 text-stone-800 font-serif-kr text-xl lg:text-2xl font-bold">
                <!-- 로고 이미지 업데이트 -->
                <img src="국립장성숲체원-_국문좌우_이미지형 (2).png" alt="국립장성숲체원 로고" class="h-8 lg:h-10 object-contain" onerror="this.src='https://placehold.co/200x60/ffffff/57534e?text=국립장성숲체원&font=noto-serif'">
                <span class="hidden sm:inline border-l border-stone-300 pl-3 ml-1 text-lg lg:text-xl">통합 영상 제작소</span>
            </div>
            
            <div class="flex items-center gap-3">
                <button id="login-btn" class="px-4 py-2 bg-stone-800 text-white rounded-xl text-sm font-gowun hover:bg-stone-700 transition shadow-sm flex items-center gap-2">
                    <i data-lucide="log-in" class="w-4 h-4"></i> 로그인
                </button>
                <div id="user-menu" class="hidden flex items-center gap-3">
                    <button id="workspace-btn" class="flex items-center gap-2 px-4 py-2 bg-stone-100 text-stone-700 border border-stone-200 rounded-xl text-sm font-gowun hover:bg-stone-200 transition shadow-sm font-bold">
                        <i data-lucide="folder-open" class="w-4 h-4 text-stone-500"></i> 내 작업물
                    </button>
                    <button id="logout-btn" class="w-9 h-9 rounded-full bg-stone-800 text-white flex items-center justify-center font-bold text-sm shadow-sm hover:bg-stone-700 transition" title="로그아웃">
                        숲
                    </button>
                </div>
            </div>
        </header>

        <div class="flex-1 flex flex-col lg:flex-row overflow-hidden bg-stone-50/50">
            <aside class="w-full lg:w-[520px] bg-white border-r border-stone-100 flex flex-col overflow-hidden z-10 shadow-[4px_0_24px_rgba(0,0,0,0.02)] relative">
                <div class="flex-1 overflow-y-auto p-6 space-y-6">
                    
                    <!-- 화면 비율 설정 -->
                    <section class="flex flex-col gap-2">
                        <h2 class="text-base lg:text-xl font-serif-kr text-stone-800 flex items-center gap-2 font-bold">
                            <i data-lucide="ratio" class="w-5 h-5 text-stone-400"></i> 화면 비율 선택
                        </h2>
                        <div class="flex gap-2">
                            <button id="ratio-vertical" class="flex-1 py-3 border-2 border-stone-800 bg-stone-800 text-white rounded-xl font-gowun flex justify-center items-center gap-2 transition-all text-sm lg:text-base">
                                <i data-lucide="smartphone" class="w-4 h-4 lg:w-5 lg:h-5"></i> 세로형 (9:16)
                            </button>
                            <button id="ratio-horizontal" class="flex-1 py-3 border-2 border-stone-200 bg-white text-stone-600 rounded-xl font-gowun flex justify-center items-center gap-2 transition-all hover:bg-stone-50 text-sm lg:text-base">
                                <i data-lucide="monitor" class="w-4 h-4 lg:w-5 lg:h-5"></i> 가로형 (16:9)
                            </button>
                        </div>
                    </section>

                    <!-- 글씨체 및 트랜지션 -->
                    <section class="flex flex-col gap-4 p-4 lg:p-5 bg-stone-50 rounded-2xl border border-stone-100">
                        <div class="flex flex-col gap-2">
                            <h2 class="text-base lg:text-xl font-serif-kr text-stone-800 flex items-center gap-2 font-bold">
                                <i data-lucide="type" class="w-5 h-5 text-stone-400"></i> 글씨체 설정
                            </h2>
                            <div class="grid grid-cols-2 gap-2" id="font-selector">
                                <button data-font="Gowun Dodum" class="font-btn py-2.5 border-2 border-stone-800 bg-stone-800 text-white rounded-xl flex justify-center items-center transition-all text-sm lg:text-base" style="font-family: 'Gowun Dodum';">고운 돋움</button>
                                <button data-font="Noto Serif KR" class="font-btn py-2.5 border-2 border-stone-200 bg-white text-stone-600 rounded-xl flex justify-center items-center transition-all hover:bg-stone-50 text-sm lg:text-base" style="font-family: 'Noto Serif KR'; font-weight: 600;">클래식 명조</button>
                                <button data-font="Gowun Batang" class="font-btn py-2.5 border-2 border-stone-200 bg-white text-stone-600 rounded-xl flex justify-center items-center transition-all hover:bg-stone-50 text-sm lg:text-base" style="font-family: 'Gowun Batang';">고운 바탕</button>
                                <button data-font="Pretendard" class="font-btn py-2.5 border-2 border-stone-200 bg-white text-stone-600 rounded-xl flex justify-center items-center transition-all hover:bg-stone-50 text-sm lg:text-base" style="font-family: 'Pretendard'; font-weight: 500;">프리텐다드</button>
                            </div>
                        </div>

                        <div class="flex flex-col gap-2 pt-3 border-t border-stone-200/80">
                            <div class="flex items-center text-sm lg:text-base text-stone-700 font-gowun mb-1">
                                <i data-lucide="clapperboard" class="w-4 h-4 mr-2 text-stone-400"></i>
                                <span class="font-semibold">화면 전환 효과 (트랜지션)</span>
                            </div>
                            <select id="transition-effect-select" class="w-full bg-white border border-stone-200 rounded-xl px-3 py-2.5 text-stone-700 font-gowun focus:outline-none focus:border-stone-400 text-sm lg:text-base cursor-pointer shadow-sm">
                                <option value="crossfade" selected>🌬️ 시네마틱 페이드 (부드럽게 겹침)</option>
                                <option value="fadeblack">🎬 필름 블랙 아웃 (영화처럼 어두워짐)</option>
                                <option value="slide">📸 포토 슬라이드 (옆으로 밀려남)</option>
                            </select>
                        </div>
                    </section>

                    <section class="p-4 bg-stone-50 rounded-2xl border border-stone-100">
                        <h2 class="text-base lg:text-xl font-serif-kr mb-3 text-stone-800 flex items-center gap-2 font-bold">
                            <i data-lucide="music" class="w-5 h-5 text-stone-400"></i> 배경음악 (BGM)
                        </h2>
                        <select id="bgm-select" class="w-full bg-white border border-stone-200 rounded-xl px-3 py-3 text-stone-700 font-gowun focus:outline-none focus:border-stone-400 text-sm lg:text-base cursor-pointer">
                            <option value="procedural" selected>🌿 실시간 힐링 사운드 (자연 합성음)</option>
                            <option value="https://ia802508.us.archive.org/5/items/relaxing-piano-music-royalty-free/Relaxing%20Piano%20Music.mp3">🎹 평온한 편백숲 (피아노 앰비언트)</option>
                            <option value="https://ia802506.us.archive.org/16/items/nature-sounds-birds-singing-relaxing/nature-sounds-birds-singing.mp3">🐤 아침 숲의 소리 (실제 새 지저귐)</option>
                            <option value="https://ia801402.us.archive.org/20/items/free_music_archive_instrumental/FMA_Instrumental_Selection_-_01_-_Gillicuddy_-_Springish.mp3">🎸 숲속의 봄날 (어쿠스틱 기타)</option>
                            <option value="custom">🎧 내 음원 직접 업로드...</option>
                            <option value="">소리 없음</option>
                        </select>
                        <!-- 숨겨진 파일 인풋 (커스텀 BGM용) -->
                        <input type="file" id="custom-bgm-input" accept="audio/*" class="hidden">
                        
                        <div id="custom-bgm-info" class="hidden flex items-center justify-between bg-stone-100 rounded-xl px-4 py-3 border border-stone-200 mt-2">
                            <div class="flex items-center gap-2 overflow-hidden">
                                <i data-lucide="file-audio" class="w-5 h-5 text-stone-500 shrink-0"></i>
                                <span id="custom-bgm-name" class="text-sm lg:text-base text-stone-600 font-gowun truncate">음원.mp3</span>
                            </div>
                            <button id="custom-bgm-remove" class="text-stone-400 hover:text-red-500 shrink-0 transition-colors" title="음원 삭제">
                                <i data-lucide="x-circle" class="w-5 h-5"></i>
                            </button>
                        </div>
                        <audio id="bgm-audio" crossorigin="anonymous" loop></audio>
                    </section>

                    <!-- 미디어 업로드 -->
                    <section>
                        <label class="cursor-pointer w-full py-8 rounded-2xl border-2 border-dashed border-stone-300 flex flex-col items-center justify-center transition-all hover:bg-stone-50 group bg-white shadow-sm">
                            <div class="w-14 h-14 rounded-full bg-stone-100 group-hover:bg-white flex items-center justify-center mb-2 transition-colors">
                                <i data-lucide="image-plus" class="w-6 h-6 text-stone-600"></i>
                            </div>
                            <span class="text-stone-700 font-serif-kr text-base lg:text-lg font-bold">터치하여 사진/동영상 추가</span>
                            <span class="text-stone-400 font-gowun text-sm mt-1">드래그 앤 드롭으로 순서 변경 가능</span>
                            <input id="image-upload" type="file" multiple accept="image/*,video/*,.mp4,.mov,.avi,.mkv,.webm" class="hidden" />
                        </label>
                    </section>

                    <!-- 스토리보드 -->
                    <section>
                        <div class="flex justify-between items-end mb-3">
                            <h2 class="text-base lg:text-xl font-serif-kr text-stone-800 flex items-center gap-2 font-bold">
                                <i data-lucide="clapperboard" class="w-5 h-5 text-stone-400"></i> 스토리보드 편집
                            </h2>
                        </div>
                        <div id="storyboard-container" class="space-y-4 pb-4">
                            <!-- JS 동적 렌더링 -->
                        </div>
                    </section>
                </div>

                <div class="p-6 border-t border-stone-100 bg-white shadow-[0_-10px_30px_rgba(0,0,0,0.02)] z-20">
                    <div class="flex justify-between items-center mb-3">
                        <span class="text-sm lg:text-base font-gowun text-stone-500">총 재생 시간</span>
                        <span id="estimated-time" class="text-lg lg:text-xl font-bold text-stone-800 font-mono">00:00</span>
                    </div>
                    <div class="flex gap-2">
                        <button id="save-draft-btn" class="flex-1 flex items-center justify-center gap-2 py-4 rounded-xl font-serif-kr text-base lg:text-lg text-stone-700 bg-stone-100 border border-stone-200 hover:bg-stone-200 transition-all active:scale-95 shadow-sm disabled:opacity-50">
                            <i data-lucide="save" class="w-5 h-5 text-stone-500"></i> 임시저장
                        </button>
                        <button id="export-btn" class="flex-[2] flex items-center justify-center gap-2 py-4 rounded-xl font-serif-kr text-lg lg:text-xl text-white bg-stone-800 hover:bg-stone-900 transition-all active:scale-95 shadow-md disabled:opacity-50 disabled:cursor-not-allowed">
                            <i data-lucide="download" class="w-5 h-5"></i> 고화질 영상 추출
                        </button>
                    </div>
                </div>
            </aside>

            <main class="flex-1 flex flex-col relative bg-stone-200/50 overflow-hidden items-center justify-center p-4 min-h-[500px]">
                
                <div id="loading-overlay" class="absolute inset-0 bg-white/95 backdrop-blur-sm z-50 hidden flex-col items-center justify-center w-full h-full">
                    <div class="w-16 h-16 border-4 border-stone-200 border-t-stone-800 rounded-full animate-spin mb-6"></div>
                    <h3 class="text-xl lg:text-2xl font-bold mb-3 text-stone-800 font-serif-kr">작업 처리 중...</h3>
                    <p class="text-stone-500 font-gowun mb-6 text-center text-sm lg:text-base">잠시만 기다려 주세요.</p>
                    <div class="w-64 lg:w-80 bg-stone-200 rounded-full h-2 overflow-hidden">
                      <div id="render-progress" class="bg-stone-800 h-full transition-all duration-300" style="width: 0%"></div>
                    </div>
                    <p id="render-time-text" class="text-xs lg:text-sm mt-2 font-mono text-stone-500">00:00 / 00:00</p>
                </div>

                <!-- 캔버스 (크기 고정 및 비율 반응형 처리 완벽 수정 - 높이 기준 반응형 적용) -->
                <div id="preview-wrapper" class="relative w-full bg-black rounded-2xl md:rounded-[2rem] overflow-hidden video-container flex-shrink-0 transition-all mx-auto" style="max-width: min(400px, calc((100vh - 300px) * 9 / 16)); aspect-ratio: 9/16;">
                    <canvas id="preview-canvas" width="1080" height="1920" class="w-full h-full object-contain"></canvas>
                    
                    <div id="empty-state" class="absolute inset-0 flex flex-col items-center justify-center text-stone-400 bg-stone-800 p-4 text-center">
                        <i data-lucide="clapperboard" class="w-12 h-12 mb-3 opacity-50 stroke-[1]"></i>
                        <p class="text-sm font-serif-kr text-stone-300">왼쪽에서 미디어를 추가해 주세요.</p>
                    </div>
                </div>

                <!-- 플레이어 컨트롤 -->
                <div class="mt-6 w-full max-w-sm lg:max-w-md bg-white rounded-2xl p-3 lg:p-4 shadow-sm border border-stone-200 flex items-center gap-3 relative z-10">
                    <button id="play-btn" class="w-10 h-10 lg:w-12 lg:h-12 rounded-full bg-stone-100 hover:bg-stone-200 flex items-center justify-center text-stone-700 transition active:scale-95 disabled:opacity-50">
                        <i data-lucide="play" class="w-4 h-4 lg:w-5 lg:h-5 ml-1"></i>
                    </button>
                    <button id="stop-btn" class="w-10 h-10 lg:w-12 lg:h-12 rounded-full hover:bg-stone-100 flex items-center justify-center text-stone-500 transition active:scale-95 disabled:opacity-50">
                        <i data-lucide="square" class="w-3 h-3 lg:w-4 lg:h-4"></i>
                    </button>
                    
                    <div class="flex-1 flex items-center gap-3 px-1">
                        <span id="current-time-display" class="text-[10px] lg:text-xs font-mono text-stone-500">00:00</span>
                        <div class="flex-1 h-1.5 lg:h-2 bg-stone-100 rounded-full cursor-pointer relative overflow-hidden" id="progress-bar-container">
                            <div id="progress-bar" class="absolute top-0 left-0 h-full bg-stone-500 pointer-events-none transition-colors" style="width: 0%;"></div>
                        </div>
                        <span id="total-time-display" class="text-[10px] lg:text-xs font-mono text-stone-400">00:00</span>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <!-- 로그인 모달 -->
    <div id="login-modal" class="fixed inset-0 bg-stone-900/60 backdrop-blur-sm z-[100] hidden items-center justify-center">
        <div class="bg-white rounded-2xl w-full max-w-sm p-6 shadow-2xl animate-fade-up">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-xl font-serif-kr font-bold text-stone-800">서비스 로그인</h2>
                <button id="close-login-btn" class="text-stone-400 hover:text-stone-600"><i data-lucide="x" class="w-5 h-5"></i></button>
            </div>
            <p class="text-stone-500 text-sm font-gowun mb-6">작업물을 안전하게 기기에 보관하고 나중에 이어서 편집하려면 로그인해 주세요.</p>
            <div class="space-y-3">
                <button id="mock-login-btn" class="w-full py-3 rounded-xl border border-stone-200 flex items-center justify-center gap-3 hover:bg-stone-50 transition active:scale-95">
                    <img src="https://www.svgrepo.com/show/475656/google-color.svg" class="w-5 h-5" alt="Google">
                    <span class="font-gowun font-bold text-stone-700">Google 계정으로 시작하기</span>
                </button>
            </div>
        </div>
    </div>

    <!-- 내 작업물(보관소) 모달 -->
    <div id="workspace-modal" class="fixed inset-0 bg-stone-900/60 backdrop-blur-sm z-[100] hidden items-center justify-center">
        <div class="bg-white rounded-2xl w-full max-w-4xl h-[85vh] flex flex-col shadow-2xl animate-fade-up overflow-hidden">
            <div class="px-6 py-4 border-b border-stone-100 flex justify-between items-center bg-stone-50">
                <h2 class="text-xl font-serif-kr font-bold text-stone-800 flex items-center gap-2">
                    <i data-lucide="folder-open" class="text-stone-500 w-5 h-5"></i> 내 작업 보관소
                </h2>
                <div class="flex items-center gap-2">
                    <button id="export-projects-btn" class="flex items-center gap-2 px-3 py-1.5 bg-white border border-stone-200 rounded-lg text-sm font-gowun text-stone-600 hover:bg-stone-50 transition shadow-sm" title="모든 프로젝트를 파일로 저장">
                        <i data-lucide="download-cloud" class="w-4 h-4"></i> 백업 저장
                    </button>
                    <button id="import-projects-btn" class="flex items-center gap-2 px-3 py-1.5 bg-stone-800 text-white rounded-lg text-sm font-gowun hover:bg-stone-700 transition shadow-sm" title="파일에서 프로젝트 불러오기">
                        <i data-lucide="upload-cloud" class="w-4 h-4"></i> 백업 열기
                    </button>
                    <input type="file" id="import-file-input" accept=".json" class="hidden">
                    <div class="w-px h-6 bg-stone-300 mx-2"></div>
                    <button id="close-workspace-btn" class="text-stone-400 hover:text-stone-600"><i data-lucide="x" class="w-6 h-6"></i></button>
                </div>
            </div>
            
            <div class="flex border-b border-stone-100 px-6 pt-2 bg-stone-50 gap-4">
                <button id="tab-draft" class="px-4 py-2 font-gowun font-bold text-stone-800 border-b-2 border-stone-800 transition-colors">임시저장 (작업 중)</button>
                <button id="tab-final" class="px-4 py-2 font-gowun text-stone-400 hover:text-stone-600 transition-colors">최종 결과물</button>
            </div>
            
            <div class="flex-1 overflow-y-auto p-6 bg-stone-100/50">
                <div id="project-list" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-5">
                    <!-- JS: 프로젝트 카드가 여기에 렌더링됩니다 -->
                </div>
                <div id="empty-projects" class="hidden flex-col items-center justify-center h-full text-stone-400 font-gowun">
                    <i data-lucide="inbox" class="w-12 h-12 mb-3 opacity-50"></i>
                    <p>저장된 작업물이 없습니다.</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        lucide.createIcons();

        // --- 유틸리티 및 커스텀 알림 시스템 ---
        function formatTime(seconds) {
            if(isNaN(seconds) || seconds < 0) return "00:00";
            const m = Math.floor(seconds / 60).toString().padStart(2, '0');
            const s = Math.floor(seconds % 60).toString().padStart(2, '0');
            return `${m}:${s}`;
        }

        function showToast(message, type = 'success') {

        // --- 텍스트 래핑 헬퍼 ---
        function drawWrapText(ctx, text, x, y, maxWidth, lineHeight) {
            const paragraphs = text.split('\n');
            let lines = [];
            paragraphs.forEach(p => {
                const words = p.split(' ');
                let currentLine = '';
                for(let n = 0; n < words.length; n++) {
                    const testLine = currentLine + words[n] + ' ';
                    const metrics = ctx.measureText(testLine);
                    if (metrics.width > maxWidth && n > 0) {
                        lines.push(currentLine); currentLine = words[n] + ' ';
                    } else { currentLine = testLine; }
                }
                lines.push(currentLine);
            });
            const totalHeight = lines.length * lineHeight;
            let startY = y - (totalHeight / 2) + (lineHeight / 2);
            for(let i=0; i<lines.length; i++) {
                ctx.fillText(lines[i].trim(), x, startY + (i * lineHeight));
            }
        }

        function setupAudioRouting() {
            if(!audioCtx) {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                if(!AudioContext) return;
                audioCtx = new AudioContext();
                audioDest = audioCtx.createMediaStreamDestination();
                
                // BGM Audio Tag 라우팅
                const source = audioCtx.createMediaElementSource(elements.bgmAudio);
                source.connect(audioCtx.destination); // 스피커로 출력
                source.connect(audioDest);            // 레코더로 출력
            }
        }

        function startProceduralAmbient() {
            stopProceduralAmbient(); setupAudioRouting();
            if(audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
            
            const bufferSize = 2 * audioCtx.sampleRate;
            const noiseBuffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
            const output = noiseBuffer.getChannelData(0);
            let b0 = 0, b1 = 0, b2 = 0, b3 = 0, b4 = 0, b5 = 0, b6 = 0;
            for (let i = 0; i < bufferSize; i++) {
                const white = Math.random() * 2 - 1;
                b0 = 0.99886 * b0 + white * 0.0555179; b1 = 0.99332 * b1 + white * 0.0750759;
                b2 = 0.96900 * b2 + white * 0.1538520; b3 = 0.86650 * b3 + white * 0.3104856;

                output[i] *= 0.05; b6 = white * 0.115926;
            }
            const noiseNode = audioCtx.createBufferSource(); noiseNode.buffer = noiseBuffer; noiseNode.loop = true;
            const filter = audioCtx.createBiquadFilter(); filter.type = 'lowpass';
            filter.frequency.setValueAtTime(250, audioCtx.currentTime); filter.Q.setValueAtTime(3, audioCtx.currentTime);
            windGain = audioCtx.createGain(); windGain.gain.setValueAtTime(0.04, audioCtx.currentTime);
            
            noiseNode.connect(filter); filter.connect(windGain); 
            windGain.connect(audioCtx.destination); windGain.connect(audioDest);

            let step = 0;

            modulateWind();

            const chimeChords = [329.63, 392.00, 440.00, 523.25, 587.33, 659.25]; 
            chimeInterval = setInterval(() => {
                if (!state.isPlaying && !state.isRecording) return;
                if (Math.random() > 0.45) playBell(chimeChords[Math.floor(Math.random() * chimeChords.length)]);

        function playBell(pitch) {
            if (!audioCtx) return;

            osc.type = 'sine'; osc.frequency.setValueAtTime(pitch, audioCtx.currentTime);

        function setFont(fontName) {

                if (btn.dataset.font === fontName) btn.className = "font-btn py-2.5 border-2 border-stone-800 bg-stone-800 text-white rounded-xl flex justify-center items-center transition-all text-sm lg:text-base";
                else btn.className = "font-btn py-2.5 border-2 border-stone-200 bg-white text-stone-600 rounded-xl flex justify-center items-center transition-all hover:bg-stone-50 text-sm lg:text-base";

        }

                elements.ratioHorizontal.className = "flex-1 py-3 border-2 border-stone-200 bg-white text-stone-600 rounded-xl font-gowun flex justify-center items-center gap-2 transition-all hover:bg-stone-50 text-sm lg:text-base";

                elements.ratioVertical.className = "flex-1 py-3 border-2 border-stone-200 bg-white text-stone-600 rounded-xl font-gowun flex justify-center items-center gap-2 transition-all hover:bg-stone-50 text-sm lg:text-base";

        }

        async function handleImageUpload(e) {
            const files = Array.from(e.target.files);
            if (!files.length) return;

            let validFiles = []; let addedCount = 0; const maxDuration = 300; 
            for (const file of files) {
                if ((state.images.length + addedCount + 1) * 4 > maxDuration) {
                    if (addedCount === 0) showToast(`최대 5분 분량까지만 제작할 수 있습니다.`, "error"); break;
                }
                validFiles.push(file); addedCount++;
            }
            if (validFiles.length === 0) { e.target.value = ''; return; }

            const loadPromises = validFiles.map(file => new Promise((resolve) => {
                const isVideo = file.type.startsWith('video/') || file.name.match(/\.(mp4|mov|avi|mkv|webm)$/i);
                if (isVideo) {
                    const dataUrl = URL.createObjectURL(file); 
                    const video = document.createElement('video');
                    video.src = dataUrl; video.muted = true; video.playsInline = true; video.preload = "auto";
                    video.onloadeddata = () => resolve({
                        id: Date.now() + Math.random(), type: 'video', mediaElement: video, src: dataUrl,
                        effect: 'none', phrase: getRandomPhrase(),
                        duration: Math.min(15, Math.max(3, Math.floor(video.duration))) 
                    });
                    video.onerror = () => resolve(null);
                    video.load();
                } else {
                    const reader = new FileReader();
                    reader.onload = (event) => {
                        const img = new Image();
                        img.onload = () => resolve({
                            id: Date.now() + Math.random(), type: 'image', mediaElement: img, src: event.target.result,
                            effect: effectTypes[Math.floor(Math.random() * effectTypes.length)],
                            phrase: getRandomPhrase(), duration: 4
                        });
                        img.src = event.target.result;
                    };
                    reader.readAsDataURL(file);
                }
            }));

            let loadedMedia = await Promise.all(loadPromises);
            state.images = [...state.images, ...loadedMedia.filter(item => item !== null)];
            
            updateDurations(); renderStoryboard(); updateUI();
            if(!state.isPlaying) drawFrame(state.currentTime);
            e.target.value = '';
        }

        function renderStoryboard() {
            elements.storyboardContainer.innerHTML = '';
            elements.storyboardContainer.appendChild(createSegmentCard('intro', null, state.intro));
            state.images.forEach((mediaObj, idx) => elements.storyboardContainer.appendChild(createSegmentCard('slide', idx, mediaObj)));
            elements.storyboardContainer.appendChild(createSegmentCard('outro', null, state.outro));
            lucide.createIcons();
        }

        function createSegmentCard(type, index, data) {
            const div = document.createElement('div');
            div.className = 'bg-stone-50 border border-stone-200 rounded-xl p-4 flex gap-4 storyboard-item items-start shadow-sm';
            
            let label = '', icon = '';
            if(type === 'intro') { label = '인트로'; icon = 'play-square'; }
            if(type === 'outro') { label = '아웃트로'; icon = 'film'; }

            let thumbHTML = '';
            if (type === 'slide') {
                div.draggable = true;
                div.addEventListener('dragstart', (e) => { state.draggedItemIndex = index; div.classList.add('dragging'); });
                div.addEventListener('dragend', () => { div.classList.remove('dragging'); state.draggedItemIndex = null; });
                div.addEventListener('dragover', (e) => e.preventDefault());
                div.addEventListener('drop', (e) => {
                    e.preventDefault();
                    if(state.draggedItemIndex === null || state.draggedItemIndex === index) return;
                    const item = state.images.splice(state.draggedItemIndex, 1)[0];
                    state.images.splice(index, 0, item);
                    updateDurations(); renderStoryboard();
                    if(!state.isPlaying) drawFrame(0);
                });

                const isVideo = data.type === 'video';
                const iconOverlay = isVideo ? `<div class="absolute top-1.5 right-1.5 bg-stone-900/80 p-1 rounded text-white shadow"><i data-lucide="video" class="w-3.5 h-3.5"></i></div>` : '';
                const mediaTag = isVideo ? `<video src="${data.src}#t=1" class="w-full h-full object-cover" muted preload="metadata"></video>` : `<img src="${data.src}" class="w-full h-full object-cover">`;

                thumbHTML = `<div class="w-16 lg:w-20 h-24 lg:h-28 shrink-0 rounded-lg overflow-hidden bg-stone-200 relative cursor-grab shadow-inner">
                        ${mediaTag}
                        <div class="absolute inset-0 bg-black/20 flex items-center justify-center opacity-0 hover:opacity-100 transition-opacity"><i data-lucide="grip-vertical" class="text-white w-5 h-5"></i></div>
                        ${iconOverlay}
                    </div>`;
            } else {
                thumbHTML = `<div class="w-16 lg:w-20 h-24 lg:h-28 shrink-0 rounded-lg bg-stone-800 text-stone-300 flex flex-col items-center justify-center gap-1">
                        <i data-lucide="${icon}" class="w-5 h-5 lg:w-6 lg:h-6"></i><span class="text-[10px] lg:text-xs font-semibold">${label}</span>
                    </div>`;
            }

            let inputsHTML = '';
            if (type === 'intro' || type === 'outro') {
                inputsHTML = `<textarea class="w-full bg-white border border-stone-200 rounded-lg px-2.5 py-1.5 text-xs lg:text-sm font-serif-kr text-stone-800 resize-none h-[44px] mb-1 focus:outline-none focus:border-stone-400" onchange="updateState('${type}', ${index}, 'title', this.value)" placeholder="위쪽 메인 문구">${data.title}</textarea>
                    <input type="text" class="w-full bg-white border border-stone-200 rounded-lg px-2.5 py-1.5 text-[11px] lg:text-xs font-gowun text-stone-500 focus:outline-none focus:border-stone-400" value="${data.subtitle}" onchange="updateState('${type}', ${index}, 'subtitle', this.value)" placeholder="아래쪽 서브 문구">`;
            } else {
                inputsHTML = `<div class="flex gap-1 w-full relative">
                        <textarea class="w-full bg-white border border-stone-200 rounded-lg px-2.5 py-1.5 text-xs lg:text-sm font-gowun text-stone-700 resize-none h-[60px] focus:outline-none focus:border-stone-400" onchange="updateState('slide', ${index}, 'phrase', this.value)" placeholder="감성 문구">${data.phrase}</textarea>
                        <button onclick="applyRandomPhrase(${index})" class="absolute bottom-1.5 right-1.5 bg-stone-100 p-1 rounded-md text-stone-500 hover:bg-stone-200 transition-colors" title="랜덤 추천"><i data-lucide="sparkles" class="w-3.5 h-3.5"></i></button>
                    </div>`;
            }

            const controlsHTML = `<div class="flex justify-between items-center mt-2">
                    <div class="flex items-center gap-1 text-[11px] lg:text-xs text-stone-500 font-gowun">
                        <i data-lucide="clock" class="w-3.5 h-3.5"></i>
                        <input type="number" min="1" max="100" class="w-10 bg-transparent border-b border-stone-300 text-center font-bold text-stone-700 focus:outline-none" value="${data.duration}" onchange="updateState('${type}', ${index}, 'duration', parseInt(this.value)||3)"> 초 재생
                    </div>
                    ${type === 'slide' ? `<button onclick="removeImage(${index})" class="text-stone-400 hover:text-red-500 transition-colors p-1" title="제거"><i data-lucide="trash-2" class="w-4 h-4"></i></button>` : ''}
                </div>`;

            div.innerHTML = `${thumbHTML}<div class="flex-1 flex flex-col justify-between h-full">${inputsHTML}${controlsHTML}</div>`;
            return div;
        }

        window.updateState = (type, index, key, value) => {
            if(type === 'intro') state.intro[key] = value;
            else if(type === 'outro') state.outro[key] = value;
            else if(type === 'slide') state.images[index][key] = value;
            updateDurations(); if(!state.isPlaying) drawFrame(state.currentTime);
        };

        window.applyRandomPhrase = (index) => {
            state.images[index].phrase = getRandomPhrase();
            renderStoryboard(); if(!state.isPlaying) drawFrame(state.currentTime);
        };

        window.removeImage = (index) => {
            const item = state.images[index];
            if (item.type === 'video') {
                item.mediaElement.pause(); item.mediaElement.removeAttribute('src'); item.mediaElement.load(); URL.revokeObjectURL(item.src);
            }
            state.images.splice(index, 1);
            updateDurations(); renderStoryboard(); updateUI();
            if(!state.isPlaying) drawFrame(0);
        };

        function updateDurations() {
            let total = state.intro.duration + state.outro.duration;
            state.images.forEach(img => total += img.duration);
            state.totalDuration = total;
            elements.totalTimeDisplay.textContent = formatTime(state.totalDuration);
            elements.estimatedTimeDisplay.textContent = formatTime(state.totalDuration);
        }

        function getSceneContext(time) {
            if (time < state.intro.duration) return { type: 'intro', elapsed: time, duration: state.intro.duration };
            let acc = state.intro.duration;
            for (let i = 0; i < state.images.length; i++) {
                if (time < acc + state.images[i].duration) return { type: 'slide', index: i, elapsed: time - acc, duration: state.images[i].duration };
                acc += state.images[i].duration;
            }
            return { type: 'outro', elapsed: time - acc, duration: state.outro.duration };
        }

        function renderSlideTransition(ctx, prevObj, currentObj, cw, ch, fadeElapsed, fadeDuration) {
            const progress = Math.max(0, Math.min(fadeElapsed / fadeDuration, 1.0));
            const theme = state.transitionEffect;

            if (theme === 'crossfade') {
                renderSlideImage(ctx, prevObj, cw, ch, prevObj.duration + fadeElapsed, 1 - progress);
                renderSlideImage(ctx, currentObj, cw, ch, fadeElapsed, progress);
            } 
            else if (theme === 'fadeblack') {
                if (progress < 0.5) {
                    renderSlideImage(ctx, prevObj, cw, ch, prevObj.duration + fadeElapsed, 1 - (progress * 2));
                } else {
                    renderSlideImage(ctx, currentObj, cw, ch, fadeElapsed, (progress - 0.5) * 2);
                }
            } 
            else if (theme === 'slide') {
                const slideDistance = cw;
                ctx.save(); ctx.translate(-(progress * slideDistance), 0);
                renderSlideImage(ctx, prevObj, cw, ch, prevObj.duration + fadeElapsed, 1.0);
                ctx.restore();

                ctx.save(); ctx.translate(slideDistance - (progress * slideDistance), 0);
                renderSlideImage(ctx, currentObj, cw, ch, fadeElapsed, 1.0);
                ctx.restore();
                
                const shadowX = slideDistance - (progress * slideDistance);
                if(shadowX > 0 && shadowX < cw) {
                    const grad = ctx.createLinearGradient(shadowX, 0, shadowX - 100, 0);
                    grad.addColorStop(0, 'rgba(0,0,0,0.8)'); grad.addColorStop(1, 'rgba(0,0,0,0)');
                    ctx.fillStyle = grad; ctx.fillRect(shadowX - 100, 0, 100, ch);
                }
            }
        }

        function renderSlideImage(ctx, mediaObj, cw, ch, elapsed, alpha) {
            ctx.globalAlpha = alpha; ctx.filter = 'blur(60px) brightness(0.25) sepia(0.2)';
            
            if (mediaObj.type === 'video') {
                const vid = mediaObj.mediaElement;
                if (!state.isPlaying && !state.isRecording) {
                    vid.currentTime = elapsed % vid.duration; if (!vid.paused) vid.pause();
                } else {
                    if (vid.paused) vid.play().catch(e=>{});
                    if (Math.abs(vid.currentTime - (elapsed % vid.duration)) > 0.4) vid.currentTime = elapsed % vid.duration;
                }
            }

            drawCoverImage(ctx, mediaObj.mediaElement, cw, ch);
            ctx.filter = 'none';
            
            const p = Math.max(0, elapsed / (mediaObj.duration + 1.5)); 
            let scale = 1.0, transX = 0, transY = 0; const drift = 40; 
            switch(mediaObj.effect) {
                case 'zoom-in':   scale = 1.0 + (p * 0.08); break;
                case 'zoom-out':  scale = 1.08 - (p * 0.08); break;
                case 'pan-left':  scale = 1.05; transX = (drift/2) - (p*drift); break;
                case 'pan-right': scale = 1.05; transX = -(drift/2) + (p*drift); break;
                case 'pan-up':    scale = 1.05; transY = (drift/2) - (p*drift); break;
                case 'pan-down':  scale = 1.05; transY = -(drift/2) + (p*drift); break;
            }
            
            ctx.save(); ctx.translate(cw/2 + transX, ch/2 + transY); ctx.scale(scale, scale); ctx.translate(-cw/2, -ch/2);
            ctx.shadowColor = 'rgba(0,0,0,0.8)'; ctx.shadowBlur = 80; ctx.shadowOffsetY = 30;
            drawDynamicFineArtFrame(ctx, mediaObj.mediaElement, cw, ch);
            ctx.restore();
        }

        function drawDynamicFineArtFrame(ctx, media, cw, ch) {
            const isVertical = ch > cw;
            const paddingX = isVertical ? 120 : 250, paddingTop = isVertical ? 300 : 150, paddingBottom = isVertical ? 450 : 250;
            const availW = cw - (paddingX * 2), availH = ch - paddingTop - paddingBottom;
            const mediaW = media.videoWidth || media.width || cw, mediaH = media.videoHeight || media.height || ch;
            const mediaRatio = mediaW / mediaH, availRatio = availW / availH;
            
            let drawW = availW, drawH = availH;
            if (mediaRatio > availRatio) drawH = availW / mediaRatio; else drawW = availH * mediaRatio;
            const offsetX = (cw - drawW) / 2, offsetY = paddingTop + (availH - drawH) / 2;

            ctx.fillStyle = '#fefefe'; const borderSize = isVertical ? 20 : 16;
            ctx.fillRect(offsetX - borderSize, offsetY - borderSize, drawW + (borderSize*2), drawH + (borderSize*2));
            ctx.strokeStyle = 'rgba(0,0,0,0.15)'; ctx.lineWidth = 2; ctx.strokeRect(offsetX, offsetY, drawW, drawH);
            ctx.drawImage(media, offsetX, offsetY, drawW, drawH);
        }

        function drawCoverImage(ctx, media, cw, ch) {
            const mediaW = media.videoWidth || media.width || cw, mediaH = media.videoHeight || media.height || ch;
            const mediaRatio = mediaW / mediaH, canvasRatio = cw / ch;
            let drawW = cw, drawH = ch, offsetX = 0, offsetY = 0;
            if (mediaRatio > canvasRatio) { drawW = ch * mediaRatio; offsetX = (cw - drawW) / 2; } 
            else { drawH = cw / mediaRatio; offsetY = (ch - drawH) / 2; }
            ctx.drawImage(media, offsetX, offsetY, drawW, drawH);
        }

        function drawFrame(timeInSeconds) {
            const ctx = elements.ctx; const width = elements.canvas.width; const height = elements.canvas.height;
            const isVertical = height > width;
            ctx.fillStyle = '#111827'; ctx.fillRect(0, 0, width, height);

            if(state.images.length === 0) return;
            const scene = getSceneContext(timeInSeconds);

            let fontSizeIntroTitle = isVertical ? 80 : 110, fontSizeIntroSubtitle = isVertical ? 48 : 64;
            let fontSizeSlide = isVertical ? 56 : 72, lineHeightSlide = isVertical ? 72 : 96;

            if (scene.type === 'intro') {
                let alpha = Math.min(scene.elapsed / 1.5, 1);
                if (scene.duration - scene.elapsed < 1) alpha = scene.duration - scene.elapsed;
                ctx.globalAlpha = alpha; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                
                ctx.shadowColor = 'rgba(0,0,0,0.8)'; ctx.shadowBlur = 15; ctx.fillStyle = '#f5f5f4'; 
                ctx.font = `400 ${fontSizeIntroTitle}px "${state.fontFamily}", sans-serif`;
                drawWrapText(ctx, state.intro.title, width/2, height/2 - (isVertical?60:40), width * 0.85, Math.round(fontSizeIntroTitle * 1.25));

                ctx.shadowColor = 'rgba(0,0,0,0.8)'; ctx.shadowBlur = 10; ctx.fillStyle = '#a8a29e'; 
                ctx.font = `300 ${fontSizeIntroSubtitle}px "Pretendard", sans-serif`;
                drawWrapText(ctx, state.intro.subtitle, width/2, height/2 + (isVertical?80:90), width * 0.85, Math.round(fontSizeIntroSubtitle * 1.25));
            } 
            else if (scene.type === 'outro') {
                let alpha = Math.min(scene.elapsed / 1.5, 1); ctx.globalAlpha = alpha; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                
                ctx.shadowColor = 'rgba(0,0,0,0.8)'; ctx.shadowBlur = 15; ctx.fillStyle = '#f5f5f4'; 
                ctx.font = `300 ${Math.round(fontSizeIntroTitle * 0.7)}px "${state.fontFamily}", sans-serif`;
                drawWrapText(ctx, state.outro.title, width/2, height/2 - (isVertical?60:50), width * 0.85, Math.round(fontSizeIntroTitle * 0.9));
                
                ctx.shadowColor = 'rgba(0,0,0,0.8)'; ctx.shadowBlur = 10; ctx.fillStyle = '#a8a29e'; 
                ctx.font = `300 ${fontSizeIntroSubtitle}px "Pretendard", sans-serif`;
                drawWrapText(ctx, state.outro.subtitle, width/2, height/2 + (isVertical?80:80), width * 0.85, Math.round(fontSizeIntroSubtitle * 1.25));
            } 
            else if (scene.type === 'slide') {
                const imgObj = state.images[scene.index];
                const fadeDuration = state.transitionEffect === 'fadeblack' ? 1.5 : 1.0; 
                let isFading = (scene.elapsed < fadeDuration && scene.index > 0);
                
                if (isFading) {
                    const prevObj = state.images[scene.index - 1];
                    renderSlideTransition(ctx, prevObj, imgObj, width, height, scene.elapsed, fadeDuration);
                } else {
                    renderSlideImage(ctx, imgObj, width, height, scene.elapsed, 1.0);
                }

                ctx.globalAlpha = 1.0;
                const vignette = ctx.createRadialGradient(width/2, height/2, width/2.5, width/2, height/2, width*1.2);
                vignette.addColorStop(0, 'rgba(0,0,0,0)'); vignette.addColorStop(1, 'rgba(0,0,0,0.85)');
                ctx.fillStyle = vignette; ctx.fillRect(0, 0, width, height);

                ctx.globalAlpha = 1.0; ctx.fillStyle = 'rgba(255, 255, 255, 0.4)';
                particles.forEach(p => {
                    if(state.isPlaying || state.isRecording) {
                        p.x += p.vx; p.y += p.vy;
                        if(p.x < 0) p.x = width; if(p.x > width) p.x = 0;
                        if(p.y < 0) p.y = height; if(p.y > height) p.y = 0;
                    }
                    ctx.beginPath(); ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2); ctx.fill();
                });

                const gradHeight = isVertical ? 600 : 400; 
                const gradient = ctx.createLinearGradient(0, height - gradHeight, 0, height);
                gradient.addColorStop(0, 'rgba(15, 15, 15, 0)'); gradient.addColorStop(0.7, 'rgba(15, 15, 15, 0.9)'); gradient.addColorStop(1, 'rgba(15, 15, 15, 1)');
                ctx.fillStyle = gradient; ctx.fillRect(0, height - gradHeight, width, gradHeight);

                ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                const currentPhrase = imgObj.phrase || "";
                const prevPhrase = scene.index > 0 ? (state.images[scene.index - 1].phrase || "") : "";
                const textY = height - (isVertical ? 220 : 160);

                ctx.fillStyle = '#e7e5e4'; ctx.font = `400 ${fontSizeSlide}px "${state.fontFamily}", sans-serif`;
                ctx.shadowColor = 'rgba(0,0,0,0.9)'; ctx.shadowBlur = 15;

                const maxWidth = width * 0.85; 
                if (isFading && prevPhrase !== currentPhrase) {
                    ctx.globalAlpha = 1 - Math.max(0, Math.min(scene.elapsed / fadeDuration, 1.0));
                    drawWrapText(ctx, prevPhrase, width / 2, textY, maxWidth, lineHeightSlide);
                    ctx.globalAlpha = Math.max(0, Math.min(scene.elapsed / fadeDuration, 1.0));
                    drawWrapText(ctx, currentPhrase, width / 2, textY, maxWidth, lineHeightSlide);
                } else {
                    ctx.globalAlpha = 1.0; 
                    drawWrapText(ctx, currentPhrase, width / 2, textY, maxWidth, lineHeightSlide);
                }
            }
            
            ctx.globalAlpha = 1.0;
            if (watermarkLogo.complete && watermarkLogo.naturalWidth > 0) {
                const logoW = isVertical ? 350 : 280;
                const logoH = watermarkLogo.naturalHeight * (logoW / watermarkLogo.naturalWidth);
                const logoX = width - logoW - (isVertical ? 60 : 50); const logoY = isVertical ? 100 : 40;
                const outline = 3; 
                ctx.shadowColor = 'white'; ctx.shadowBlur = 2; 
                const offsets = [
                    [-outline, 0], [outline, 0], [0, -outline], [0, outline],
                    [-outline, -outline], [outline, -outline], [-outline, outline], [outline, outline]
                ];
                offsets.forEach(off => { ctx.shadowOffsetX = off[0]; ctx.shadowOffsetY = off[1]; ctx.drawImage(watermarkLogo, logoX, logoY, logoW, logoH); });
                ctx.shadowColor = 'transparent'; ctx.shadowOffsetX = 0; ctx.shadowOffsetY = 0;
                ctx.drawImage(watermarkLogo, logoX, logoY, logoW, logoH);
            }
            ctx.globalAlpha = 1.0; ctx.shadowBlur = 0;
            updateProgressUI(timeInSeconds);
        }

        function updateUI() {
            const hasImages = state.images.length > 0;
            elements.emptyState.style.display = hasImages ? 'none' : 'flex';
            elements.playBtn.disabled = !hasImages; elements.stopBtn.disabled = !hasImages; elements.exportBtn.disabled = !hasImages;
            elements.playBtn.innerHTML = state.isPlaying ? '<i data-lucide="pause" class="w-4 h-4"></i>' : '<i data-lucide="play" class="w-4 h-4 ml-1"></i>';
            lucide.createIcons();
        }

        function togglePlay() {
            if (state.images.length === 0) return;
            setupAudioRouting(); if(audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
            
            if (state.isPlaying) {
                state.isPlaying = false; cancelAnimationFrame(state.animationFrameId); elements.bgmAudio.pause(); stopProceduralAmbient();
            } else {
                state.isPlaying = true; state.lastTimestamp = performance.now();
                if (state.currentTime >= state.totalDuration) state.currentTime = 0;
                
                if (elements.bgmSelect.value === 'procedural') { startProceduralAmbient(); } 
                else if(elements.bgmAudio.src) {
                    elements.bgmAudio.currentTime = state.currentTime % (elements.bgmAudio.duration || state.totalDuration || 1);
                    elements.bgmAudio.play().catch(e => console.log(e));
                }
                animationLoop(performance.now());
            }
            updateUI();
        }

        function stopPlayback() {
            state.isPlaying = false; cancelAnimationFrame(state.animationFrameId); state.currentTime = 0; 
            elements.bgmAudio.pause(); elements.bgmAudio.currentTime = 0; stopProceduralAmbient();
            state.images.forEach(img => { if(img.type === 'video' && !img.mediaElement.paused) img.mediaElement.pause(); });
            drawFrame(0); updateUI();
        }

        function seekTime(e) {
            if (state.images.length === 0) return;
            const rect = elements.progressContainer.getBoundingClientRect();
            state.currentTime = Math.max(0, Math.min(((e.clientX - rect.left) / rect.width) * state.totalDuration, state.totalDuration));
            if (elements.bgmAudio.src && elements.bgmSelect.value !== 'procedural') elements.bgmAudio.currentTime = state.currentTime % (elements.bgmAudio.duration || state.totalDuration || 1);
            drawFrame(state.currentTime);
        }

        function animationLoop(timestamp) {
            if (!state.isPlaying) return;
            state.currentTime += (timestamp - state.lastTimestamp) / 1000; state.lastTimestamp = timestamp;
            if (state.currentTime >= state.totalDuration) { state.currentTime = state.totalDuration; drawFrame(state.currentTime); stopPlayback(); return; }
            drawFrame(state.currentTime); state.animationFrameId = requestAnimationFrame(animationLoop);
        }

        function updateProgressUI(time) {
            if (state.totalDuration > 0) {
                elements.progressBar.style.width = `${(time / state.totalDuration) * 100}%`;
                elements.currentTimeDisplay.textContent = formatTime(time);
            }
        }

        async function exportVideo() {
            if (state.images.length === 0 || state.isRecording) return;
            if(state.isPlaying) stopPlayback();
            
            state.isRecording = true; elements.loadingOverlay.style.display = 'flex'; elements.exportBtn.disabled = true;
            elements.loadingOverlay.querySelector('h3').textContent = "고화질 영상 렌더링 중...";
            setupAudioRouting(); if(audioCtx && audioCtx.state === 'suspended') audioCtx.resume();

            const fps = 30; let canvasStream;
            try { canvasStream = elements.canvas.captureStream(fps); } 
            catch (err) {
                showToast("브라우저 보안 정책으로 차단되었습니다. 로컬 파일에서 실행해주세요.", "error");
                elements.loadingOverlay.style.display = 'none'; state.isRecording = false; elements.exportBtn.disabled = false; return;
            }
            
            let tracks = [...canvasStream.getVideoTracks()];
            if (audioDest) {
                const audioTracks = audioDest.stream.getAudioTracks();
                if (audioTracks.length > 0) tracks = [...tracks, ...audioTracks];
            }

            const combinedStream = new MediaStream(tracks);
            let options = {}; let ext = 'mp4';
            if (MediaRecorder.isTypeSupported('video/mp4; codecs="avc1, mp4a.40.2"')) options = { mimeType: 'video/mp4; codecs="avc1, mp4a.40.2"' };
            else if (MediaRecorder.isTypeSupported('video/mp4')) options = { mimeType: 'video/mp4' };
            else if (MediaRecorder.isTypeSupported('video/webm; codecs=vp9,opus')) { options = { mimeType: 'video/webm; codecs=vp9,opus' }; ext = 'webm'; } 
            else { options = { mimeType: 'video/webm' }; ext = 'webm'; }
            
            const recorder = new MediaRecorder(combinedStream, options);
            const chunks = [];
            recorder.ondataavailable = (e) => { if (e.data.size > 0) chunks.push(e.data); };
            recorder.onstop = () => {
                if(elements.bgmAudio.src) { elements.bgmAudio.pause(); elements.bgmAudio.currentTime = 0; }
                stopProceduralAmbient();
                state.images.forEach(img => { if(img.type === 'video' && !img.mediaElement.paused) img.mediaElement.pause(); });

                const a = document.createElement('a'); a.style.display = 'none';
                a.href = URL.createObjectURL(new Blob(chunks, { type: options.mimeType || 'video/mp4' }));
                a.download = `숲체원_영상_${Date.now()}.${ext}`;
                document.body.appendChild(a); a.click(); document.body.removeChild(a);
                
                state.isRecording = false; elements.loadingOverlay.style.display = 'none'; elements.exportBtn.disabled = false; drawFrame(0);
                saveProjectToDB('final');
            };
            
            if (elements.bgmSelect.value === 'procedural') startProceduralAmbient();
            else if(elements.bgmAudio.src) { elements.bgmAudio.currentTime = 0; try { await elements.bgmAudio.play(); } catch(e) {} }
            
            recorder.start();
            
            const startRecordingTime = performance.now();
            function renderNextFrame(timestamp) {
                // setTimeout 대신 requestAnimationFrame의 timestamp를 사용하여 '실제 경과 시간'을 정확히 계산
                const renderTime = (timestamp - startRecordingTime) / 1000;
                
                if (renderTime > state.totalDuration) { 
                    recorder.stop(); 
                    return; 
                }
                
                drawFrame(renderTime);
                elements.renderProgress.style.width = `${(renderTime / state.totalDuration) * 100}%`;
                elements.renderTimeText.textContent = `${formatTime(renderTime)} / ${formatTime(state.totalDuration)}`;
                
                requestAnimationFrame(renderNextFrame);
            }
            requestAnimationFrame(renderNextFrame);
        }

        // 앱 시작
        init();
    </script>
</body>
